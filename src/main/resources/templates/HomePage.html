<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>ADV Shop</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5 text-center">
  <div class="jumbotron">
    <h1 class="display-4">ADV Shop</h1>
    <hr class="my-4">
    <h3>Welcome</h3>
    <p class="lead">Efficiently manage your product inventory with ease.</p>

    <div class="mt-4">
      <a th:href="@{/product/list}" class="btn btn-primary btn-lg mx-2">View Product List</a>
      <a th:href="@{/product/create}" class="btn btn-success btn-lg mx-2">Create New Product</a>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
</body>
</html>
